<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Mundo de Formas y Números · con Poli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
<div id="app">
  <div id="bg" aria-hidden="true"></div>

  <header id="bar">
    <button id="btnBack" class="round" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="title">Mundo de Formas y Números</h1>
    <div id="starsPill" class="pill" hidden></div>
    <button id="btnVoice" class="round" aria-label="Sonido">
      <svg viewBox="0 0 24 24" id="icoVoice"></svg>
    </button>
  </header>

  <main id="screen"></main>

  <footer id="dock">
    <div id="poli"></div>
    <div id="bubble">
      <span id="bubbleText"></span>
      <button id="replay" aria-label="Escuchar otra vez">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button id="action" class="btn" hidden></button>
  </footer>

  <canvas id="confetti" aria-hidden="true"></canvas>
</div>
<script src="js/app.js?v=12"></script>
<script src="js/numeros.js?v=12"></script>
</body>
</html>
